name: CI
on:
  push:
    branches: [main, creator-ai-final-t3, creator-ai-final-t3-align, final-t3-100-percent, "feat/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm test
